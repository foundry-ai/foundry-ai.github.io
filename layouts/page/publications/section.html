{{ define "main" }}
<div class="container" role="main">
  <div class="row">
    <div class="col-lg-8 col-lg-offset-2 col-md-10 col-md-offset-1">
      {{ with .RegularPages }}
        {{ partial "publications/list.html" . }}
        <hr>
      {{ end }}
      <article class="blog-post">
        {{ .Content }}
      </article>
    </div>
  </div>
</div>
{{ end }}
