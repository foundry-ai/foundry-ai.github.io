{{ define "main" }}
<div class="container" role="main">
  <div class="row">
    <div class="col-lg-8 col-lg-offset-2 col-md-10 col-md-offset-1">
      {{ with site.GetPage "/page/publications" }}
        <p><a href="{{ .RelPermalink }}">&larr; Publications</a></p>
      {{ end }}
      {{ .Content }}
      {{ partial "publications/list.html" (dict "pages" .RegularPages) }}
    </div>
  </div>
</div>
{{ end }}
